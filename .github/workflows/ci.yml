name: CI & Runtime QA Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qa:
    name: Build, Typecheck, Lint & Runtime QA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5

      - name: TypeScript check
        run: npm run typecheck
        timeout-minutes: 3

      - name: Run Linter
        run: npm run lint
        timeout-minutes: 3

      - name: Build Next.js application
        run: npm run build
        timeout-minutes: 10

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5

      - name: Run Playwright Runtime QA Suite
        run: |
          npm run start -- -p 3000 &
          npx wait-on http://localhost:3000 --timeout 30000
          TEST_URL=http://localhost:3000/ npm run test:qa
          TEST_URL=http://localhost:3000/ npm run test:qa-dark
          TEST_URL=http://localhost:3000/ npm run test:qa-regression
        timeout-minutes: 8

      - name: Upload Visual & QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-visual-screenshots
          path: |
            *.png
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Security Audit
        run: npm audit --audit-level=critical
        continue-on-error: true
        timeout-minutes: 2
