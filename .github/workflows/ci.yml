name: CI & Runtime QA Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-qa:
    name: Build & Automated QA Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Runtime QA Suite
        run: |
          npm run start -- -p 3000 &
          npx wait-on http://localhost:3000 --timeout 30000
          TEST_URL=http://localhost:3000/ npm run test:qa

      - name: Upload Visual & QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-visual-screenshots
          path: '*.png'
          retention-days: 7
